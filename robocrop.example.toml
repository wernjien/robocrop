# robocrop settings.
#
# ./robocrop --setup copies robocrop.example.toml to robocrop.toml, which
# every run from this folder loads. Edit robocrop.toml; git pull updates the
# example, so new settings show up there.
#
# Apart from input, the example's values are the defaults. Keys match the
# command-line flags with dashes turned into underscores, except `multi`
# (--multi-face) and `detector_opts` (--detector-opt). Anything you also pass
# on the command line wins.

input  = "~/Pictures/portraits"
output = "./dataset"

# ---- detection ----------------------------------------------------------
# yunet | haar | yolox
detector  = "yunet"

# drop detections below this confidence
min_score = 0.8

# all | largest | skip
multi     = "all"

# To crop bodies instead of faces, set detector above to "yolox" and add:
# detector_opts = { classes = "person" }

# ---- crop geometry ------------------------------------------------------
# percent added to every side of the detection
padding   = 20

sizes     = [256, 512, 768, 1024]

# keep each whole photo, shape kept and long side resized to a size above,
# instead of cropping around the subject
# no_crop = true

# or keep each photo at its native size: skip photos shorter than min_side,
# and shrink those longer than max_side to it
# keep_size = true
# min_side  = 256
# max_side  = 1536

# fraction of a size a detection needs to reach to qualify for it.
# The lower this is, the more a qualifying crop can need enlarging -- keep
# it above 0.5 so that need never exceeds what the bundled AI upscaling
# model handles in one pass (see `upscale` below); going lower falls back
# to a plain resize for the remainder.
min_ratio = 0.8

# drop blurry crops below this score; 0 disables it.
# No fixed ceiling (unlike min_ratio/min_score) -- it's
# a Laplacian-variance score, not a fraction. Real sharp
# crops typically land 15-96; go higher than that only
# if you've checked your own manifest.jsonl scores first.
min_sharpness = 10

# how the box becomes a square: max | mean | width | height | diag
base_mode = "max"

# commented out = use the detector's own correction
# (-0.08 for face detectors, 0 for yolox bodies).
# Set 0.0 to disable it, or go lower for more headroom.
# offset_y  = -0.08

# shift | extend | skip
edge      = "shift"

# only used when edge = "extend"
fill      = "blur"

# enlarge undersized crops with AI upscaling instead of a plain resize;
# needs opencv-contrib-python. Crops that already meet or exceed
# their tier are unaffected either way.
# upscale = true

# ---- masks --------------------------------------------------------------
# All write NAME-masklabel.png beside each crop, for masked training.
#
# To learn the body and outfit but not the face: mask every face
# out of training. Needs a body detector (detector = "yolox" above).
# mask_faces     = true

# outline: the face's own shape | oval: an oval over the whole head
# face_mask      = "outline"

# percent of the face box added to every side of an oval mask
# mask_margin    = 35

# a crop where no face was found: skip | keep
# mask_missing   = "skip"

# mask_min_score = 0.5

# Weight the background down, so the model learns the person rather than
# where the photos were taken. Combines with mask_faces.
# mask_background   = true

# loss weight of the background, 0-1; 0 ignores it completely
# background_weight = 0.1

# Weight clothing and accessories down, so the model learns the person
# rather than their outfits. Combines with the masks above.
# mask_clothing   = true

# loss weight of clothing, 0-1
# clothing_weight = 0.0

# For ai-toolkit or kohya: write the masks into this folder, named like
# their crop, instead of NAME-masklabel.png beside it. Must be outside output.
# mask_dir = "./dataset-masks"

# ---- output -------------------------------------------------------------
# png | jpg | webp
format  = "png"

# jpg/webp only
quality = 95

# e.g. "subject_" -> subject_0001.png
prefix  = ""

digits  = 4

# ---- captions -----------------------------------------------------------
# vlm | template | none
captioner     = "vlm"

# smolvlm | smolvlm-small | qwen | joycaption | joycaption-nf4 | huihui-qwen3-vl-4b | blip
# see ./robocrop --list-models for downloads and memory guidance
caption_model = "smolvlm"

# optional: a unique word the trained model binds the subject to
# e.g. "my subject" or leave empty for no trigger
trigger       = ""

# joycaption-nf4 needs NVIDIA CUDA and requirements-caption-nf4.txt.
# Start with 1 for JoyCaption (including NF4) or Huihui to reduce peak memory use.
caption_batch = 4

# Remove phrases you never want in a caption:
# caption_drop = ["\\bblurry\\b", ",?\\s*watermark"]
